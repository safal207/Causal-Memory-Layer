name: eBPF Runtime Proof

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: cml-ebpf-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
  PYTHONUNBUFFERED: "1"

jobs:
  fd-reuse-proof:
    name: Live kernel read trust proofs
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout exact head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Prove exact-head checkout
        run: |
          /usr/bin/python3 -m scripts.ci.assert_exact_head \
            --expected "$EXPECTED_SHA" \
            --output artifacts/ebpf-runtime/exact-head.json

      - name: Initialize fail-closed runtime evidence
        run: |
          mkdir -p artifacts/ebpf-runtime
          /usr/bin/python3 - <<'PY'
          import json
          from pathlib import Path

          proofs = {
              "fd-reuse-proof.json": "cml-ebpf-fd-reuse-runtime-proof-v1",
              "witness-issued-read-token-proof.json": "cml-witness-issued-read-token-runtime-proof-v1",
          }
          for filename, schema_version in proofs.items():
              path = Path("artifacts/ebpf-runtime") / filename
              payload = {
                  "schema_version": schema_version,
                  "status": "UNSUPPORTED_ENVIRONMENT",
                  "reason": "runtime proof did not reach the BPF harness",
              }
              path.write_text(
                  json.dumps(payload, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )
          PY

      - name: Install BCC runtime
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          record_unsupported() {
            REASON="$1" /usr/bin/python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          proofs = {
              "fd-reuse-proof.json": "cml-ebpf-fd-reuse-runtime-proof-v1",
              "witness-issued-read-token-proof.json": "cml-witness-issued-read-token-runtime-proof-v1",
          }
          for filename, schema_version in proofs.items():
              path = Path("artifacts/ebpf-runtime") / filename
              payload = {
                  "schema_version": schema_version,
                  "status": "UNSUPPORTED_ENVIRONMENT",
                  "reason": os.environ["REASON"],
              }
              path.write_text(
                  json.dumps(payload, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )
          PY
          }

          # Hosted Ubuntu runners can prefer a regional Azure mirror that may
          # stall independently of our code. For this live-proof bootstrap,
          # use one deterministic upstream mirror when the image exposes the
          # mirror list consumed by apt.
          if [[ -f /etc/apt/apt-mirrors.txt ]]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu' \
              | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi

          apt_with_deadline() {
            sudo -E timeout --kill-after=15s 180s \
              apt-get \
              -o Acquire::Retries=2 \
              -o Acquire::http::Timeout=20 \
              -o Acquire::https::Timeout=20 \
              "$@"
          }

          if ! apt_with_deadline update; then
            record_unsupported "apt-get update failed or timed out"
            exit 1
          fi
          if ! apt_with_deadline install -y --no-install-recommends python3-bpfcc bpfcc-tools; then
            record_unsupported "BCC package installation failed or timed out"
            exit 1
          fi

      - name: Run live fd-reuse kernel proof
        run: |
          sudo -E env PYTHONPATH="$GITHUB_WORKSPACE" \
            /usr/bin/python3 vcml/linux-ebpf/runtime_fd_reuse_proof.py \
            --output artifacts/ebpf-runtime/fd-reuse-proof.json

      - name: Run live witness-issued token ledger proof
        run: |
          sudo -E env PYTHONPATH="$GITHUB_WORKSPACE" \
            /usr/bin/python3 vcml/linux-ebpf/runtime_read_binding_trust_entrypoint.py \
            --output artifacts/ebpf-runtime/witness-issued-read-token-proof.json

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cml-ebpf-runtime-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ebpf-runtime/
          if-no-files-found: error
          retention-days: 30
